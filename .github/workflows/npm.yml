name: npm

# Publishes the JavaScript of Storehouse (the LiveView uploader and the
# upload client) to npm as @hattoriai/storehouse, when a release is
# published. By npm's trusted publishing: no token, npm trusts this
# workflow of this repository (the package's Settings → Trusted Publisher
# on npmjs.com, with the environment below), and the package says which
# run built it (provenance).

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its required reviewers approve each release before it is published.
    environment: npm
    permissions:
      contents: read
      # The run's OIDC identity, which npm checks in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing takes npm 11.5.1 or later.
      - run: npm install --global npm@latest

      # The release's tag, package.json and mix.exs name one version.
      - name: one version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p 'require("./package.json").version')"
          mix_version="$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)"
          echo "tag $tag, package.json $npm_version, mix.exs $mix_version"
          test "$tag" = "$npm_version" && test "$tag" = "$mix_version"

      # A version on npm already (published by hand) is left as it is.
      - name: publish
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "@hattoriai/storehouse@$version" version > /dev/null 2>&1; then
            echo "@hattoriai/storehouse@$version is on npm already"
          else
            npm publish --access public
          fi
